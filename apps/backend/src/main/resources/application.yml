server:
  port: ${PORT:3000}
  servlet:
    context-path: /api

spring:
  application:
    name: truck-fleet-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/truck_fleet}
    username: ${DB_USERNAME:truck_admin}
    password: ${DB_PASSWORD:truck_secret_2024}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /docs/swagger-ui.html
    operationsSorter: method

cors:
  allowed-origins: ${CORS_ORIGIN:http://localhost:4200}
