# cloudflared inoltra X-Forwarded-Proto; se per qualche motivo manca,
# ricadiamo su $scheme invece di propagare un header vuoto.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # La linea di casa ha upload limitato: comprimere tutto il comprimibile
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # Reverse proxy verso Spring Boot (context-path = /api)
    location /api/ {
        proxy_pass         http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }

    # Asset con hash nel nome (outputHashing: all) -> cache lunga
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # index.html mai in cache: altrimenti dopo un redeploy il browser
    # chiede chunk con hash vecchi che non esistono piu'
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA Angular: tutto il resto ricade su index.html (routing client-side)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
