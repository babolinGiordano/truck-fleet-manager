version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: truck-fleet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: truck_admin
      POSTGRES_PASSWORD: truck_secret_2024
      POSTGRES_DB: truck_fleet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truck_admin -d truck_fleet"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: truck-fleet-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
